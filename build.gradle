plugins {
    id 'base'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.143' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.143' apply false
    id 'net.minecraftforge.gradle' version '7.0.34' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.17.19' apply false
    id 'net.fabricmc.fabric-loom' version '1.17.19' apply false
}

group = mod_group_id
version = mod_version

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// Keep the root build useful for contributors and CI: one command verifies every
// loader/version artifact in the matrix.
tasks.named('build').configure {
    dependsOn ':common:build'
    dependsOn ':platforms:neoforge:mc1.21.1:build'
    dependsOn ':platforms:neoforge:mc1.21.11:build'
    dependsOn ':platforms:neoforge:mc26.1.2:build'
    dependsOn ':platforms:forge:mc1.18.2:build'
    dependsOn ':platforms:forge:mc1.19.2:build'
    dependsOn ':platforms:forge:mc1.20.1:build'
    dependsOn ':platforms:forge:mc1.21.1:build'
    dependsOn ':platforms:forge:mc1.21.11:build'
    dependsOn ':platforms:forge:mc26.1.2:build'
    dependsOn ':platforms:fabric:mc1.18.2:build'
    dependsOn ':platforms:fabric:mc1.19.2:build'
    dependsOn ':platforms:fabric:mc1.20.1:build'
    dependsOn ':platforms:fabric:mc1.21.1:build'
    dependsOn ':platforms:fabric:mc1.21.11:build'
    dependsOn ':platforms:fabric:mc26.1.2:build'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

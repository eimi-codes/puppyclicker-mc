plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
    id 'idea'
}

ext {
    minecraft_version = '26.1.2'
    minecraft_version_range = '[26.1.2]'
    neo_version = '26.1.2.95'
    neo_version_range = '[26.1.2.95,26.2)'
    loader_version_range = '[1,)'
    java_version = 25
}

apply from: rootProject.file('gradle/neoforge-platform.gradle')

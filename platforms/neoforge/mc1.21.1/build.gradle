plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
    id 'idea'
}

ext {
    minecraft_version = '1.21.1'
    minecraft_version_range = '[1.21.1]'
    neo_version = '21.1.248'
    neo_version_range = '[21.1.243,21.2)'
    loader_version_range = '[1,)'
    java_version = 21
}

apply from: rootProject.file('gradle/neoforge-platform.gradle')

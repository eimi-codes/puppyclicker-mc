plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom-remap'
    id 'idea'
}

ext {
    minecraft_version = '1.20.1'
    fabric_loader_version = '0.19.3'
    fabric_api_version = '0.92.11+1.20.1'
    java_version = 17
}

apply from: rootProject.file('gradle/fabric-platform.gradle')

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom-remap'
    id 'idea'
}

ext {
    minecraft_version = '1.21.11'
    fabric_loader_version = '0.19.3'
    fabric_api_version = '0.141.6+1.21.11'
    java_version = 21
}

apply from: rootProject.file('gradle/fabric-platform.gradle')

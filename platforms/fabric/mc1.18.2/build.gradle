plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom-remap'
    id 'idea'
}

ext {
    minecraft_version = '1.18.2'
    fabric_loader_version = '0.19.3'
    fabric_api_version = '0.77.0+1.18.2'
    java_version = 17
}

apply from: rootProject.file('gradle/fabric-platform.gradle')

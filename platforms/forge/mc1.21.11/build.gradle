plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle'
    id 'idea'
}

ext {
    minecraft_version = '1.21.11'
    minecraft_version_range = '[1.21.11]'
    forge_version = '61.1.13'
    forge_version_range = '[61.1.13,62)'
    loader_version_range = '[24,)'
    java_version = 21
}

apply from: rootProject.file('gradle/forge-modern-platform.gradle')

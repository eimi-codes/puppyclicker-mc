plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle'
    id 'idea'
}

ext {
    minecraft_version = '26.1.2'
    minecraft_version_range = '[26.1.2]'
    forge_version = '64.0.11'
    forge_version_range = '[64.0.11,65)'
    loader_version_range = '[24,)'
    java_version = 25
}

apply from: rootProject.file('gradle/forge-modern-platform.gradle')

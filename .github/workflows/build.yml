name: Build supported versions

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # Loom requires the Gradle process to run on Java 21 or newer. The
        # project toolchains still compile Minecraft 1.18.2–1.20.1 for Java 17.
        include:
          - name: Common tests
            java: "21"
            task: :common:build
          - name: NeoForge 1.21.1
            java: "21"
            task: :platforms:neoforge:mc1.21.1:build
          - name: NeoForge 1.21.11
            java: "21"
            task: :platforms:neoforge:mc1.21.11:build
          - name: NeoForge 26.1.2
            java: "25"
            task: :platforms:neoforge:mc26.1.2:build
          - name: Forge 1.18.2
            java: "21"
            task: :platforms:forge:mc1.18.2:build
          - name: Forge 1.19.2
            java: "21"
            task: :platforms:forge:mc1.19.2:build
          - name: Forge 1.20.1
            java: "21"
            task: :platforms:forge:mc1.20.1:build
          - name: Forge 1.21.1
            java: "21"
            task: :platforms:forge:mc1.21.1:build
          - name: Forge 1.21.11
            java: "21"
            task: :platforms:forge:mc1.21.11:build
          - name: Forge 26.1.2
            java: "25"
            task: :platforms:forge:mc26.1.2:build
          - name: Fabric 1.18.2
            java: "21"
            task: :platforms:fabric:mc1.18.2:build
          - name: Fabric 1.19.2
            java: "21"
            task: :platforms:fabric:mc1.19.2:build
          - name: Fabric 1.20.1
            java: "21"
            task: :platforms:fabric:mc1.20.1:build
          - name: Fabric 1.21.1
            java: "21"
            task: :platforms:fabric:mc1.21.1:build
          - name: Fabric 1.21.11
            java: "21"
            task: :platforms:fabric:mc1.21.11:build
          - name: Fabric 26.1.2
            java: "25"
            task: :platforms:fabric:mc26.1.2:build

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if ./gradlew --version; then
              break
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "Gradle wrapper download failed after $attempt attempts." >&2
              exit 1
            fi

            sleep $((attempt * 5))
          done

      - name: Build and test
        run: ./gradlew --no-daemon ${{ matrix.task }}

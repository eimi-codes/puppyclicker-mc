name: Publish GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

# Creating the release and uploading its assets are the only write operations.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish tagged release
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate tag and project version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease." >&2
            exit 1
          fi

          version="${tag#v}"
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ "$version" != "$mod_version" ]]; then
            echo "Tag version $version does not match gradle.properties mod_version=$mod_version." >&2
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Build release JARs
        run: ./gradlew --no-daemon build

      - name: Prepare release assets
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          targets=(
            "platforms/neoforge/mc1.21.1/build/libs/puppyclicker-neoforge-1.21.1-${VERSION}.jar"
            "platforms/neoforge/mc1.21.11/build/libs/puppyclicker-neoforge-1.21.11-${VERSION}.jar"
            "platforms/neoforge/mc26.1.2/build/libs/puppyclicker-neoforge-26.1.2-${VERSION}.jar"
            "platforms/forge/mc1.18.2/build/libs/puppyclicker-forge-1.18.2-${VERSION}.jar"
            "platforms/forge/mc1.19.2/build/libs/puppyclicker-forge-1.19.2-${VERSION}.jar"
            "platforms/forge/mc1.20.1/build/libs/puppyclicker-forge-1.20.1-${VERSION}.jar"
            "platforms/forge/mc1.21.1/build/libs/puppyclicker-forge-1.21.1-${VERSION}.jar"
            "platforms/forge/mc1.21.11/build/libs/puppyclicker-forge-1.21.11-${VERSION}.jar"
            "platforms/forge/mc26.1.2/build/libs/puppyclicker-forge-26.1.2-${VERSION}.jar"
            "platforms/fabric/mc1.18.2/build/libs/puppyclicker-fabric-1.18.2-${VERSION}.jar"
            "platforms/fabric/mc1.19.2/build/libs/puppyclicker-fabric-1.19.2-${VERSION}.jar"
            "platforms/fabric/mc1.20.1/build/libs/puppyclicker-fabric-1.20.1-${VERSION}.jar"
            "platforms/fabric/mc1.21.1/build/libs/puppyclicker-fabric-1.21.1-${VERSION}.jar"
            "platforms/fabric/mc1.21.11/build/libs/puppyclicker-fabric-1.21.11-${VERSION}.jar"
            "platforms/fabric/mc26.1.2/build/libs/puppyclicker-fabric-26.1.2-${VERSION}.jar"
          )

          for artifact in "${targets[@]}"; do
            if [[ ! -f "$artifact" ]]; then
              echo "Expected release artifact was not built: $artifact" >&2
              exit 1
            fi

            # Store only the filename so users can verify it beside the downloaded JAR.
            artifact_dir="$(dirname "$artifact")"
            artifact_name="$(basename "$artifact")"
            (
              cd "$artifact_dir"
              sha256sum "$artifact_name" > "${artifact_name}.sha256"
            )
          done

      - name: Prepare release notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]( - [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9])?$" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "CHANGELOG.md has no release notes for $VERSION." >&2
            exit 1
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail

          assets=()
          for artifact in platforms/{neoforge,forge,fabric}/*/build/libs/puppyclicker-*-"${VERSION}".jar; do
            assets+=("$artifact" "${artifact}.sha256")
          done

          if [[ "${#assets[@]}" -ne 30 ]]; then
            echo "Expected 15 JARs and 15 checksums, found ${#assets[@]} assets." >&2
            exit 1
          fi

          args=(release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file release-notes.md)

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease --latest=false)
          fi

          gh "${args[@]}"

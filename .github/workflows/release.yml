name: Publish GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

# Creating the release and uploading its assets are the only write operations.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish tagged release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate tag and project version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease." >&2
            exit 1
          fi

          version="${tag#v}"
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ "$version" != "$mod_version" ]]; then
            echo "Tag version $version does not match gradle.properties mod_version=$mod_version." >&2
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Build release JAR
        run: ./gradlew --no-daemon build

      - name: Prepare release assets
        id: assets
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          artifact_name="puppyclicker-${VERSION}.jar"
          artifact="build/libs/${artifact_name}"
          checksum="${artifact}.sha256"
          if [[ ! -f "$artifact" ]]; then
            echo "Expected release artifact was not built: $artifact" >&2
            exit 1
          fi

          # Store only the filename so users can run sha256sum -c beside the downloaded JAR.
          (
            cd build/libs
            sha256sum "$artifact_name" > "${artifact_name}.sha256"
          )
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ARTIFACT: ${{ steps.assets.outputs.artifact }}
          CHECKSUM: ${{ steps.assets.outputs.checksum }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail

          args=(
            release create "$TAG"
            "$ARTIFACT"
            "$CHECKSUM"
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --generate-notes
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease --latest=false)
          fi

          gh "${args[@]}"

name: Publish GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

# Repository writes are limited to the GitHub release; marketplace uploads use
# their dedicated API tokens and run with read-only repository permissions.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish tagged release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_type: ${{ steps.version.outputs.version_type }}
      targets: ${{ steps.targets.outputs.targets }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check marketplace publishing credentials
        shell: bash
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$CURSEFORGE_TOKEN" || -z "$MODRINTH_TOKEN" ]]; then
            echo "CURSEFORGE_TOKEN and MODRINTH_TOKEN must be configured as Actions secrets." >&2
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if ./gradlew --version; then
              break
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "Gradle wrapper download failed after $attempt attempts." >&2
              exit 1
            fi

            sleep $((attempt * 5))
          done

      - name: Validate tag and project version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease." >&2
            exit 1
          fi

          version="${tag#v}"
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ "$version" != "$mod_version" ]]; then
            echo "Tag version $version does not match gradle.properties mod_version=$mod_version." >&2
            exit 1
          fi

          prerelease=false
          version_type=release
          if [[ "$version" == *-* ]]; then
            prerelease=true
            version_type=beta
            if [[ "${version,,}" == *alpha* ]]; then
              version_type=alpha
            fi
          fi

          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "version_type=$version_type"
          } >> "$GITHUB_OUTPUT"

      - name: Validate release target manifest
        id: targets
        shell: bash
        run: |
          set -euo pipefail

          .github/scripts/validate-release-targets.sh
          echo "targets=$(jq -c . .github/release-targets.json)" >> "$GITHUB_OUTPUT"

      - name: Build release JARs
        run: ./gradlew --no-daemon build

      - name: Prepare release assets
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          while IFS= read -r template; do
            artifact="${template/\{version\}/$VERSION}"
            if [[ ! -f "$artifact" ]]; then
              echo "Expected release artifact was not built: $artifact" >&2
              exit 1
            fi

            # Store only the filename so users can verify it beside the downloaded JAR.
            artifact_dir="$(dirname "$artifact")"
            artifact_name="$(basename "$artifact")"
            (
              cd "$artifact_dir"
              sha256sum "$artifact_name" > "${artifact_name}.sha256"
            )
          done < <(jq -r '.[].artifact' .github/release-targets.json)

      - name: Prepare release notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]( - [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9])?$" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "CHANGELOG.md has no release notes for $VERSION." >&2
            exit 1
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail

          assets=()
          while IFS= read -r template; do
            artifact="${template/\{version\}/$VERSION}"
            assets+=("$artifact" "${artifact}.sha256")
          done < <(jq -r '.[].artifact' .github/release-targets.json)

          if [[ "${#assets[@]}" -ne 30 ]]; then
            echo "Expected 15 JARs and 15 checksums, found ${#assets[@]} assets." >&2
            exit 1
          fi

          args=(release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file release-notes.md)

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease --latest=false)
          fi

          gh "${args[@]}"

  publish-marketplaces:
    name: ${{ matrix.platform }} · ${{ matrix.target.display }} ${{ matrix.target.minecraft }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform:
          - modrinth
          - curseforge
        target: ${{ fromJSON(needs.release.outputs.targets) }}

    steps:
      - name: Download GitHub release asset and notes
        id: asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail

          template='${{ matrix.target.artifact }}'
          artifact="${template/\{version\}/$VERSION}"
          filename="$(basename "$artifact")"

          mkdir -p marketplace
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$filename" \
            --dir marketplace
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq .body > marketplace/release-notes.md

          test -s "marketplace/$filename"
          test -s marketplace/release-notes.md
          echo "file=marketplace/$filename" >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth
        if: matrix.platform == 'modrinth'
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: puppyclicker
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.asset.outputs.file }}
          name: PuppyClicker ${{ needs.release.outputs.version }} — ${{ matrix.target.display }} ${{ matrix.target.minecraft }}
          version: ${{ needs.release.outputs.version }}+${{ matrix.target.loader }}.${{ matrix.target.minecraft }}
          version-type: ${{ needs.release.outputs.version_type }}
          changelog-file: marketplace/release-notes.md
          loaders: ${{ matrix.target.loader }}
          environment: client | server
          game-versions: ${{ matrix.target.minecraft }}
          game-version-filter: none
          java: ${{ matrix.target.java }}
          retry-attempts: 3
          retry-delay: 10000
          fail-mode: fail

      - name: Publish to CurseForge
        if: matrix.platform == 'curseforge'
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          curseforge-id: 1650038
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.asset.outputs.file }}
          name: PuppyClicker ${{ needs.release.outputs.version }} — ${{ matrix.target.display }} ${{ matrix.target.minecraft }}
          version: ${{ needs.release.outputs.version }}+${{ matrix.target.loader }}.${{ matrix.target.minecraft }}
          version-type: ${{ needs.release.outputs.version_type }}
          changelog-file: marketplace/release-notes.md
          loaders: ${{ matrix.target.loader }}
          environment: client | server
          game-versions: ${{ matrix.target.minecraft }}
          game-version-filter: none
          java: ${{ matrix.target.java }}
          retry-attempts: 3
          retry-delay: 10000
          fail-mode: fail

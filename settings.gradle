pluginManagement {
    repositories {
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'puppyclicker-minecraft'

include 'common'
include 'platforms:neoforge:mc1.21.1'
include 'platforms:neoforge:mc1.21.11'
include 'platforms:neoforge:mc26.1.2'
include 'platforms:forge:mc1.18.2'
include 'platforms:forge:mc1.19.2'
include 'platforms:forge:mc1.20.1'
include 'platforms:forge:mc1.21.1'
include 'platforms:forge:mc1.21.11'
include 'platforms:forge:mc26.1.2'
include 'platforms:fabric:mc1.18.2'
include 'platforms:fabric:mc1.19.2'
include 'platforms:fabric:mc1.20.1'
include 'platforms:fabric:mc1.21.1'
include 'platforms:fabric:mc1.21.11'
include 'platforms:fabric:mc26.1.2'
